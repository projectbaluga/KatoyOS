name: Build KatoyOS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support python3-pillow python3-pytest python3-mido python3-pyqt6

      - name: Run unit tests
        run: |
          pytest tests/

      - name: Generate assets
        run: |
          python3 tools/make-assets.py

      - name: Build KatoyOS
        run: |
          ./build.sh

      - name: Upload KatoyOS Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KatoyOS-Image
          path: out/*
          if-no-files-found: error
