name: Build KatoyOS Image

on:
  workflow_dispatch:
    inputs:
      os_name:
        description: 'OS name text for Plymouth splash'
        type: string
        default: 'KatoyOS'
      tagline:
        description: 'Tagline text for Plymouth splash'
        type: string
        default: ''
      logo_base64:
        description: 'Base64-encoded PNG logo image to override the default brand logo'
        type: string
        required: false
        default: ''
      background_color:
        description: 'Splash background color (#RRGGBB)'
        type: string
        default: '#030616'
      logo_width:
        description: 'Maximum logo width in pixels'
        type: number
        default: 700
      logo_y_offset:
        description: 'Logo vertical offset in pixels'
        type: number
        default: 32
      name_font_size:
        description: 'KatoyOS name font size in pixels'
        type: number
        default: 72
      tagline_font_size:
        description: 'Tagline font size in pixels'
        type: number
        default: 32
      name_color:
        description: 'KatoyOS name text color (#RRGGBB)'
        type: string
        default: '#FFFFFF'
      tagline_color:
        description: 'Tagline text color (#RRGGBB)'
        type: string
        default: '#DCE1F0'
      regular_font:
        description: 'Regular font file name or path available in runner'
        type: string
        default: 'DejaVuSans.ttf'
      bold_font:
        description: 'Bold font file name or path available in runner'
        type: string
        default: 'DejaVuSans-Bold.ttf'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support python3-pillow python3-pytest python3-mido python3-pyqt6

      - name: Run unit tests
        run: |
          pytest tests/

      - name: Configure Plymouth boot splash
        if: github.event_name == 'workflow_dispatch'
        run: |
          LOGO_ARG="--logo assets/katoyos-brand.png"
          if [ -n "${{ inputs.logo_base64 }}" ]; then
            TMP_LOGO=$(mktemp /tmp/custom-logo-XXXXXX.png)
            echo "${{ inputs.logo_base64 }}" | base64 -d > "$TMP_LOGO"
            LOGO_ARG="--logo $TMP_LOGO"
          fi
          python3 tools/make-splash.py \
            $LOGO_ARG \
            --name "${{ inputs.os_name }}" \
            --tagline "${{ inputs.tagline }}" \
            --background "${{ inputs.background_color }}" \
            --logo-width "${{ inputs.logo_width }}" \
            --logo-y-offset "${{ inputs.logo_y_offset }}" \
            --name-font-size "${{ inputs.name_font_size }}" \
            --tagline-font-size "${{ inputs.tagline_font_size }}" \
            --name-color "${{ inputs.name_color }}" \
            --tagline-color "${{ inputs.tagline_color }}" \
            --regular-font "${{ inputs.regular_font }}" \
            --bold-font "${{ inputs.bold_font }}" \
            --out stage-katoy/01-branding/files/plymouth-splash.png
          if [ -n "$TMP_LOGO" ] && [ -f "$TMP_LOGO" ]; then
            rm -f "$TMP_LOGO"
          fi

      - name: Build KatoyOS
        run: |
          ./build.sh

      - name: Upload KatoyOS Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KatoyOS-Image
          path: out/*
          if-no-files-found: error
