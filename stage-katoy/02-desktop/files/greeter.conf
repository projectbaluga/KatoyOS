[greeter]
background=/usr/share/backgrounds/katoyos/default.png
theme-name=Adwaita
icon-theme-name=Papirus-Dark
cursor-theme-name=DMZ-White
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
clock-format=%I:%M %p  -  %A, %B %d
indicators=~spacer;~clock;~spacer;~session;~power
position=50%,center
default-user-image=#avatar-default
