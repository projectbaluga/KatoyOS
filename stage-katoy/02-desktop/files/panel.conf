[General]
__userfile__=true

# Windows 11 style: 48px taskbar with start button, pinned apps and running
# apps (accent underline) on the left, tray and clock on the right.
# LXQt cannot centre plugins inside one panel; spacer plugins were tested
# and do not do it, so the taskbar stays left-aligned.
[panel1]
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=24
lineCount=1
lockPanel=false
opacity=100
panelSize=48
plugins=mainmenu, quicklaunch, taskbar, statusnotifier, tray, volume, worldclock, showdesktop
position=Bottom
reserve-space=true
width=100
width-percent=true

[mainmenu]
alignment=Left
icon=/usr/share/icons/hicolor/64x64/apps/katoyos.png
showText=false
type=mainmenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/katoy-browser.desktop
apps\3\desktop=/usr/share/applications/qterminal.desktop
apps\size=3
type=quicklaunch

[taskbar]
alignment=Left
type=taskbar
buttonStyle=Icon
buttonWidth=44
groupingEnabled=true
raiseOnCurrentDesktop=false
showOnlyOneDesktopTasks=false

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
alignment=Right
type=tray

[volume]
alignment=Right
type=volume

# Time over date, 12-hour, like the Windows tray clock
[worldclock]
alignment=Right
type=worldclock
formatType=custom
customFormat="h:mm AP'<br/>'dd/MM/yyyy"
showTooltip=false

[showdesktop]
alignment=Right
type=showdesktop
