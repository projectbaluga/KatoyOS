[General]
__userfile__=true

[panel1]
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=22
lineCount=1
lockPanel=false
opacity=100
panelSize=40
plugins=mainmenu, quicklaunch, taskbar, tray, statusnotifier, volume, worldclock, showdesktop
position=Bottom
reserve-space=true
width=100
width-percent=true

[mainmenu]
alignment=Left
icon=/usr/share/icons/hicolor/64x64/apps/katoyos.png
showText=false
type=mainmenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/katoy-browser.desktop
apps\size=3
type=quicklaunch

[taskbar]
alignment=Left
type=taskbar

[tray]
alignment=Right
type=tray

[statusnotifier]
alignment=Right
type=statusnotifier

[volume]
alignment=Right
type=volume

[worldclock]
alignment=Right
type=worldclock

[showdesktop]
alignment=Right
type=showdesktop
