# KatoyOS Karaoke Player Configuration
# Location: /etc/katoyos/karaoke.conf

# SONGS_DIR:
# 'auto' scans standard removable media mount roots (/media/katoy, /media, /run/media/katoy)
# for the first removable drive containing a song folder or MIDI/.kar files.
# If no USB drive with songs is inserted, 'auto' falls back to built-in songs in /usr/share/katoy/songs.
# Alternatively, set an explicit directory path (e.g. /usr/share/katoy/songs for built-in SD songs,
# or /media/katoy/USB_DISK/karaoke).
SONGS_DIR=auto

# SOUNDFONT:
# Path to a SoundFont file (.sf2) on the USB drive or system (e.g. /media/katoy/USB_DISK/soundfonts/default.sf2).
# If blank, katoy-karaoke will look for common system fallback soundfonts (e.g. /usr/share/sounds/sf2/FluidR3_GM.sf2).
SOUNDFONT=

# BACKGROUND:
# Path to a background image or directory of images on the USB drive for slideshow display behind lyrics.
# If blank, katoy-karaoke will use the default KatoyOS brand wallpaper.
BACKGROUND=

# AUDIO_DRIVER:
# Audio driver for FluidSynth (e.g. pulseaudio, alsa, pipewire).
# Default: pulseaudio (works with pipewire-pulse shim on KatoyOS).
AUDIO_DRIVER=pulseaudio

# FULLSCREEN:
# 1 = Start in fullscreen frameless mode, 0 = Windowed mode.
FULLSCREEN=1

# KIOSK:
# 1 = Appliance mode (default). The Pi boots straight into this player via katoy-karaoke.service and
#     Esc on the song list never quits the app (there is no desktop behind it).
# 0 = Windowed/desktop use: Esc on the song list closes the player.
KIOSK=1

# MICROPHONE & AUDIO CONFIGURATION:
# MIC_ENABLED: 1 = Enable microphone input monitoring, 0 = Disabled.
MIC_ENABLED=1

# MIC_VOLUME: Microphone input volume level (0 to 100).
MIC_VOLUME=80

# MUSIC_VOLUME: Karaoke music playback volume level (0 to 100).
MUSIC_VOLUME=100

# MIC_REVERB: 0 = Dry mic (recommended on Pi 3B to preserve low CPU usage), 1 = Software reverb target.
MIC_REVERB=0

# OUTPUT_DEVICE: Target audio output sink (e.g. auto, hdmi, 3.5mm, usb).
OUTPUT_DEVICE=auto

# PHONE REMOTE CONFIGURATION:
# REMOTE_ENABLED: 1 = Start phone web remote server on boot, 0 = Disabled.
REMOTE_ENABLED=1

# REMOTE_PORT: HTTP port for phone web remote interface.
REMOTE_PORT=8080

# REMOTE_PIN: Optional numeric PIN required to connect from phone (blank = no PIN).
REMOTE_PIN=

# HOTSPOT CONFIGURATION:
# HOTSPOT_SSID: NetworkManager Wi-Fi AP SSID when no known network is connected.
HOTSPOT_SSID=KatoyOS-Karaoke

# HOTSPOT_PASSWORD: WPA2 Passphrase for onboard setup hotspot.
HOTSPOT_PASSWORD=katoyos123

# HOTSPOT_GRACE: Seconds the network must stay down before the setup hotspot is raised.
# (The player starts early in boot, so Wi-Fi gets this long to connect on its own first.)
HOTSPOT_GRACE=45

# HOTSPOT_IFNAME: Wireless network interface name.
HOTSPOT_IFNAME=wlan0

# SCORING CONFIGURATION:
# SCORING_MODE: 'real' = Microphone VAD energy coverage, 'fun' = Random videoke score (88-100).
SCORING_MODE=real
