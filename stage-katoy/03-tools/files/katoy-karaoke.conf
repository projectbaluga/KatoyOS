# KatoyOS Karaoke Player Configuration
# Location: /etc/katoyos/karaoke.conf

# SONGS_DIR:
# 'auto' scans standard removable media mount roots (/media/katoy, /media, /run/media/katoy)
# for the first removable drive containing a song folder or MIDI/.kar files.
# Alternatively, set an explicit directory path (e.g. /media/katoy/USB_DISK/karaoke).
SONGS_DIR=auto

# SOUNDFONT:
# Path to a SoundFont file (.sf2) on the USB drive or system (e.g. /media/katoy/USB_DISK/soundfonts/default.sf2).
# If blank, katoy-karaoke will look for common system fallback soundfonts (e.g. /usr/share/sounds/sf2/FluidR3_GM.sf2).
SOUNDFONT=

# BACKGROUND:
# Path to a background image or directory of images on the USB drive for slideshow display behind lyrics.
# If blank, katoy-karaoke will use the default KatoyOS brand wallpaper.
BACKGROUND=

# AUDIO_DRIVER:
# Audio driver for FluidSynth (e.g. pulseaudio, alsa, pipewire).
# Default: pulseaudio (works with pipewire-pulse shim on KatoyOS).
AUDIO_DRIVER=pulseaudio

# FULLSCREEN:
# 1 = Start in fullscreen frameless mode, 0 = Windowed mode.
FULLSCREEN=1

# KIOSK:
# 1 = Enable kiosk autostart on system boot via /etc/xdg/autostart/katoy-karaoke.desktop.
# 0 = Normal desktop startup (launch manually from applications menu).
KIOSK=0
